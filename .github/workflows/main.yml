name: Next.js Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify frontend files
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f package.json ]]; then
            echo "::error::package.json tidak ditemukan di root repository."
            exit 1
          fi

          if [[ ! -f package-lock.json ]]; then
            echo "::error::package-lock.json tidak ditemukan di root repository."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_PRIEMMAN_API_URL: ${{ vars.NEXT_PUBLIC_PRIEMMAN_API_URL || secrets.NEXT_PUBLIC_PRIEMMAN_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${NEXT_PUBLIC_PRIEMMAN_API_URL:-}" ]]; then
            echo "::error::NEXT_PUBLIC_PRIEMMAN_API_URL belum diatur."
            echo "Tambahkan pada Settings > Secrets and variables > Actions."
            echo "Isi dengan URL backend API produksi."
            exit 1
          fi

          # Build langsung agar hasil tetap berada di ./out.
          ./node_modules/.bin/next build

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s out/index.html ]]; then
            echo "::error::out/index.html tidak ditemukan."
            echo "Pastikan next.config menggunakan output: 'export'."
            exit 1
          fi

          if [[ ! -d out/_next ]]; then
            echo "::error::Direktori out/_next tidak ditemukan."
            exit 1
          fi

          du -sh out

      - name: Upload frontend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Deploy frontend to VPS
    needs: build
    runs-on: ubuntu-24.04

    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    concurrency:
      group: priemman-frontend-production
      cancel-in-progress: false

    steps:
      - name: Deploy using SSH as arky
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_ARTIFACT: frontend-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          envs: DEPLOY_REPOSITORY,DEPLOY_RUN_ID,DEPLOY_ARTIFACT
          script: |
            set -eu

            if [ "$(id -un)" != "arky" ]; then
              echo "Error: VPS_USERNAME harus diatur menjadi arky."
              exit 1
            fi

            if [ ! -r /home/arky/deploy-frontend.sh ]; then
              echo "Error: /home/arky/deploy-frontend.sh tidak ditemukan atau tidak dapat dibaca."
              exit 1
            fi

            bash -x /home/arky/deploy-frontend.sh \
              "$DEPLOY_REPOSITORY" \
              "$DEPLOY_RUN_ID" \
              "$DEPLOY_ARTIFACT"
